name: tests

on:
  push:
    branches: [main, codex/rag-v3-corpus-foundation]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run v3 regression suite
        run: python -m pytest tests/v3 -q
